<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14161a" />
    <link rel="icon" type="image/svg+xml" href="/static/logo.svg" />
    <title>Eloise</title>
    <link rel="stylesheet" href="/static/css/app.css" />
  </head>
  <body>
    <section id="auth-screen" class="auth-stage hidden">
      <div class="auth-wrap">
        <div class="brand-mark">
          <img class="brand-logo" src="/static/logo.svg" alt="" /><span
            class="brand-name"
            >Eloise</span
          >
        </div>
        <p class="auth-tagline">say it, schedule it, do it</p>
        <div class="auth-plate">
          <div class="plate-ember"></div>
          <div id="auth-form"></div>
        </div>
      </div>
    </section>

    <section id="app-screen" class="hidden">
      <div class="mark">
        <img src="/static/logo.svg" alt="" /><span>Eloise</span>
      </div>

      <nav id="dock" class="itabs" aria-label="Sections">
        <button
          class="itab t-today"
          data-screen="today"
          onclick="navigate('today')"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="8" />
            <path d="M12 7v5l3 2" /></svg
          ><span>Today</span>
        </button>
        <button
          class="itab t-plan"
          data-screen="schedule"
          onclick="navigate('schedule')"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="4" y="5" width="16" height="15" rx="2" />
            <path d="M4 10h16M9 3v4M15 3v4" /></svg
          ><span>Plan</span>
        </button>
        <button
          class="itab t-board"
          data-screen="board"
          onclick="navigate('board')"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 19V9M12 19V5M19 19v-7" /></svg
          ><span>Board</span>
        </button>
        <button
          class="itab t-goals"
          data-screen="goals"
          onclick="navigate('goals')"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="8" />
            <circle cx="12" cy="12" r="3.5" /></svg
          ><span>Goals</span>
        </button>
        <button
          class="itab t-file"
          data-screen="new-goal"
          onclick="navigate('new-goal')"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5v14M5 12h14" /></svg
          ><span>New goal</span>
        </button>
        <button
          class="itab t-me"
          data-screen="settings"
          onclick="navigate('settings')"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8" r="3.5" />
            <path d="M5 20c1-4 4-5.5 7-5.5s6 1.5 7 5.5" /></svg
          ><span>Me</span>
        </button>
      </nav>

      <form
        class="desk"
        id="desk"
        onsubmit="return deskSend(event);"
        autocomplete="off"
      >
        <button
          type="button"
          class="sigil"
          onclick="toggleChatPanel()"
          aria-label="Open the conversation"
        >
          <img src="/static/logo.svg" alt="" /><i
            id="orbit-dot"
            class="orbit-chat-dot"
          ></i>
        </button>
        <input
          id="desk-input"
          type="text"
          maxlength="2000"
          aria-label="Tell Eloise"
          placeholder="Tell Eloise what you finished..."
        />
        <button class="desk-go" type="submit" aria-label="Send">
          <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
        </button>
      </form>

      <main id="main-content"></main>

      <aside id="chat-panel" class="chat-panel" aria-hidden="true">
        <div class="panel-head">
          <div class="panel-id">
            <span class="panel-sigil"
              ><img src="/static/logo.svg" alt=""
            /></span>
            <div class="panel-meta">
              <div class="panel-name">Eloise</div>
              <div class="panel-model" id="panel-model">checking the line…</div>
            </div>
          </div>
          <button
            class="panel-close"
            onclick="toggleChatPanel(false)"
            title="Close"
          >
            &times;
          </button>
        </div>
        <div id="chat-container" class="chat-container"></div>
        <div class="chat-quick">
          <button class="chip quick-chip" onclick="quickChat('Today')">
            Today
          </button>
          <button class="chip quick-chip" onclick="quickChat('Score')">
            Score
          </button>
          <button class="chip quick-chip" onclick="quickChat('Fire')">
            Urgent
          </button>
          <button class="chip quick-chip" onclick="quickChat('Momentum')">
            Momentum
          </button>
          <button class="chip quick-chip" onclick="quickChat('Stakes')">
            Stakes
          </button>
          <button class="chip quick-chip" onclick="quickChat('reschedule')">
            Skip today
          </button>
        </div>
        <div class="chat-input">
          <input
            type="text"
            id="global-chat-input"
            placeholder="Say something…"
            autocomplete="off"
          />
          <button class="btn send-btn" onclick="sendGlobalChat()" title="Send">
            <svg viewBox="0 0 24 24">
              <path d="M22 2L11 13" />
              <path d="M22 2l-7 20-4-9-9-4 20-7z" />
            </svg>
          </button>
        </div>
      </aside>
    </section>

    <div id="toasts" class="toasts"></div>

    <script src="/static/js/app.js"></script>
  </body>
</html>

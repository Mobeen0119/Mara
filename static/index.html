<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eloise</title>
    <meta name="theme-color" content="#120e1a" />
    <link rel="stylesheet" href="/static/css/app.css" />
  </head>
  <body>
    <!-- ===================== AUTH ===================== -->
    <section id="auth-screen" class="auth-stage hidden">
      <div class="auth-wrap">
        <div class="brand-mark">
          <span class="brand-name">Eloise</span>
          <span class="brand-digit">//exe</span>
        </div>
        <p class="auth-tagline">execution is the only discipline</p>
        <div class="auth-plate">
          <div class="plate-ember"></div>
          <div id="auth-form"></div>
        </div>
      </div>
    </section>

    <!-- ===================== APP ===================== -->

    <section id="app-screen" class="hidden">
      <!-- Dock: a slim vertical rail on desktop, a floating pill on phones -->
      <nav id="dock" class="dock" aria-label="Sections">
        <div class="dock-brand" title="Eloise">E</div>
        <div class="dock-items">
          <button
            class="dock-item"
            data-screen="today"
            onclick="navigate('today')"
          >
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="9" />
              <path d="M12 7v5l3 2" /></svg
            ><span>Today</span>
          </button>
          <button
            class="dock-item"
            data-screen="board"
            onclick="navigate('board')"
          >
            <svg viewBox="0 0 24 24">
              <path d="M4 20V10M10 20V4M16 20v-8M22 20H2" /></svg
            ><span>Board</span>
          </button>
          <button
            class="dock-item"
            data-screen="goals"
            onclick="navigate('goals')"
          >
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="9" />
              <circle cx="12" cy="12" r="4.5" />
              <circle cx="12" cy="12" r=".8" /></svg
            ><span>Goals</span>
          </button>
          <button
            class="dock-item dock-add"
            data-screen="new-goal"
            onclick="navigate('new-goal')"
          >
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg
            ><span>File goal</span>
          </button>
          <button
            class="dock-item"
            data-screen="schedule"
            onclick="navigate('schedule')"
          >
            <svg viewBox="0 0 24 24">
              <rect x="3" y="5" width="18" height="16" rx="3" />
              <path d="M3 10h18M8 3v4M16 3v4" /></svg
            ><span>Schedule</span>
          </button>
          <button
            class="dock-item"
            data-screen="settings"
            onclick="navigate('settings')"
          >
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="3" />
              <path
                d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"
              /></svg
            ><span>Settings</span>
          </button>
        </div>
        <div class="dock-foot">
          <button
            class="dock-item dock-chat"
            data-action="chat"
            onclick="toggleChatPanel()"
          >
            <svg viewBox="0 0 24 24">
              <path
                d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-5.4A8 8 0 1 1 21 12z"
              /></svg
            ><span>Chat</span><i id="orbit-dot" class="orbit-chat-dot"></i>
          </button>
          <div class="orbit-user" id="orbit-user" title="Signed in">?</div>
        </div>
      </nav>

      <main id="main-content"></main>

      <!-- Persistent chat side panel -->
      <aside id="chat-panel" class="chat-panel" aria-hidden="true">
        <div class="panel-head">
          <div class="panel-id">
            <span class="panel-sigil">E</span>
            <div class="panel-meta">
              <div class="panel-name">Eloise</div>
              <div class="panel-model" id="panel-model">checking the line…</div>
            </div>
          </div>
          <button
            class="panel-close"
            onclick="toggleChatPanel(false)"
            title="Close"
          >
            &times;
          </button>
        </div>
        <div id="chat-container" class="chat-container"></div>
        <div class="chat-quick">
          <button class="chip quick-chip" onclick="quickChat('Today')">
            Today
          </button>
          <button class="chip quick-chip" onclick="quickChat('Score')">
            Score
          </button>
          <button class="chip quick-chip" onclick="quickChat('Fire')">
            Urgent
          </button>
          <button class="chip quick-chip" onclick="quickChat('Momentum')">
            Momentum
          </button>
          <button class="chip quick-chip" onclick="quickChat('Stakes')">
            Stakes
          </button>
          <button class="chip quick-chip" onclick="quickChat('Fuck it')">
            Fuck it
          </button>
        </div>
        <div class="chat-input">
          <input
            type="text"
            id="global-chat-input"
            placeholder="Say something…"
            autocomplete="off"
          />
          <button class="btn send-btn" onclick="sendGlobalChat()" title="Send">
            <svg viewBox="0 0 24 24">
              <path d="M22 2L11 13" />
              <path d="M22 2l-7 20-4-9-9-4 20-7z" />
            </svg>
          </button>
        </div>
      </aside>
    </section>

    <div id="toasts" class="toasts"></div>

    <script src="/static/js/app.js"></script>
  </body>
</html>

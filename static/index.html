<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eloise</title>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>



<!-- ===================== AUTH ===================== -->
<section id="auth-screen" class="auth-stage hidden">
  <div class="auth-wrap">
    <div class="brand-mark"><span class="brand-name">Eloise</span> <span class="brand-digit">//exe</span></div>
    <p class="auth-tagline">execution is the only discipline</p>
    <div class="auth-plate">
      <div class="plate-ember"></div>
      <div id="auth-form"></div>
    </div>
  </div>
</section>

<!-- ===================== APP ===================== -->
  

<section id="app-screen" class="hidden">

  <!-- Orbital nav: hover the core to bloom the sections into an arc -->
  <nav id="orbit" class="orbit" aria-label="Sections">
    <span class="orbit-ring" aria-hidden="true"></span>
    <button class="orbit-item" data-screen="today" style="--a:-170deg; --d:.02s; --accent:var(--copper)" onclick="navigate('today')">
      <span class="orbit-glyph">◐</span><span class="orbit-label">Today</span>
    </button>
    <button class="orbit-item" data-screen="board" style="--a:-143deg; --d:.05s; --accent:var(--teal)" onclick="navigate('board')">
      <span class="orbit-glyph">▤</span><span class="orbit-label">Board</span>
    </button>
    <button class="orbit-item" data-screen="goals" style="--a:-116deg; --d:.08s; --accent:var(--violet)" onclick="navigate('goals')">
      <span class="orbit-glyph">◎</span><span class="orbit-label">Goals</span>
    </button>
    <button class="orbit-item" data-screen="new-goal" style="--a:-89deg; --d:.11s; --accent:var(--ember)" onclick="navigate('new-goal')">
      <span class="orbit-glyph">＋</span><span class="orbit-label">File goal</span>
    </button>
    <button class="orbit-item" data-screen="schedule" style="--a:-62deg; --d:.14s; --accent:var(--azure)" onclick="navigate('schedule')">
      <span class="orbit-glyph">▦</span><span class="orbit-label">Schedule</span>
    </button>
    <button class="orbit-item" data-screen="settings" style="--a:-35deg; --d:.17s; --accent:var(--rose)" onclick="navigate('settings')">
      <span class="orbit-glyph">⚙</span><span class="orbit-label">Settings</span>
    </button>
    <button class="orbit-item" data-action="chat" style="--a:-8deg; --d:.2s; --accent:var(--ok)" onclick="toggleChatPanel()">
      <span class="orbit-glyph">✎</span><span class="orbit-label">Chat</span>
    </button>
    <button id="orbit-core" class="orbit-core" onclick="toggleOrbit()" title="Sections">
      <span id="orbit-dot" class="orbit-chat-dot"></span>E
    </button>
    <span class="orbit-hint">hover the orb</span>
  </nav>

  <div class="orbit-user" id="orbit-user" title="Signed in">?</div>

  <main id="main-content"></main>

  <!-- Persistent chat side panel -->
  <aside id="chat-panel" class="chat-panel" aria-hidden="true">
    <div class="panel-head">
      <div class="panel-id">
        <span class="panel-sigil">E</span>
        <div class="panel-meta">
          <div class="panel-name">Eloise</div>
          <div class="panel-model" id="panel-model">checking the line…</div>
        </div>
      </div>
      <button class="panel-close" onclick="toggleChatPanel(false)" title="Close">&times;</button>
    </div>
    <div id="chat-container" class="chat-container"></div>
    <div class="chat-quick">
      <button class="chip quick-chip" onclick="quickChat('Today')">Today</button>
      <button class="chip quick-chip" onclick="quickChat('Score')">Score</button>
      <button class="chip quick-chip" onclick="quickChat('Fire')">Urgent</button>
      <button class="chip quick-chip" onclick="quickChat('Momentum')">Momentum</button>
      <button class="chip quick-chip" onclick="quickChat('Stakes')">Stakes</button>
      <button class="chip quick-chip" onclick="quickChat('Fuck it')">Fuck it</button>
    </div>
    <div class="chat-input">
      <input type="text" id="global-chat-input" placeholder="Say something…" autocomplete="off">
      <button class="btn send-btn" onclick="sendGlobalChat()" title="Send">
        <svg viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      </button>
    </div>
  </aside>
</section>

<div id="toasts" class="toasts"></div>

<script src="/static/js/app.js"></script>
</body>
</html>
